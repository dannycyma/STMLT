:root{--ink:#244f61;--blue:#3779a0;--yellow:#ffd564;--paper:#fffdf6}*{box-sizing:border-box}body{margin:0;background:#f3f8fa;color:var(--ink);font-family:'PingFang HK','Microsoft JhengHei',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;font:inherit;color:inherit;border:0}button:focus-visible,a:focus-visible{outline:4px solid #eaaa37;outline-offset:3px}[hidden]{display:none!important}header{max-width:930px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:23px 25px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:32px;font-weight:900}.brand span{font-size:14px}.brand small{display:block;font-size:10px;font-weight:400;margin-top:6px;letter-spacing:2px}.round{background:#fff;border:1px solid #d8e7ec;border-radius:50%;height:44px;width:44px;font-size:21px}main{max-width:560px;margin:0 auto;padding:8px 20px}#welcome{text-align:center}.eyebrow{font-size:10px;letter-spacing:3px;color:#7a9eae;margin-top:17px}h1{font-size:clamp(35px,7vw,50px);letter-spacing:1px;margin:15px 0 12px;position:relative}h1 span{color:#d79335}h1 i{font-size:24px;font-style:normal;position:absolute;top:-5px;color:#e6b84c}.subtitle{font-size:15px;color:#668897;margin:0 0 23px}.poster{position:relative;height:250px;background:#dceef5;border-radius:95px 95px 25px 25px;overflow:hidden}.cloud{position:absolute;background:#ffffffb3;border-radius:40px;width:90px;height:25px}.cloud:before{content:'';position:absolute;left:20px;top:-17px;width:43px;height:43px;background:#ffffffc9;border-radius:50%}.c1{left:6%;top:16%}.c2{right:5%;top:31%;transform:scale(.7)}.sun{position:absolute;right:14%;top:25px;width:45px;height:45px;border-radius:50%;background:#f8da83;box-shadow:0 0 0 9px #f8da832b}.sample{position:absolute;width:104px;padding:10px 4px;background:#fffdf7;border-radius:18px;box-shadow:0 5px 0 #b5d4df;font-size:14px;font-weight:700;z-index:2}.sample b{display:block;font-size:32px;margin-bottom:5px}.s1{left:8%;top:36px;transform:rotate(-10deg)}.s2{right:9%;top:58px;transform:rotate(12deg)}.s3{left:39%;top:15px;transform:rotate(3deg)}.poster-kid{position:absolute;left:calc(50% - 40px);bottom:28px;font-size:65px;width:80px;z-index:3}.basket{background:#f5ba57;color:#fff4bd;border:4px solid #df9b40;border-top:8px solid #a9703e;border-radius:7px 7px 24px 24px;text-align:center;font-size:29px;line-height:39px;box-shadow:inset 0 -6px #e7a744}.poster-kid .basket{margin-top:-12px}.hill{height:57px;width:120%;position:absolute;left:-10%;bottom:-15px;background:#b7d6ae;border-radius:50%}.flower{position:absolute;z-index:2;font-size:28px;color:#f8e1a4;bottom:7px}.f1{left:15%}.f2{right:17%;color:#fff}.rules{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:19px 0 22px;font-weight:700}.options{display:flex;gap:12px}.choice{flex:1;background:#edf3f4;border:2px solid transparent;border-radius:17px;padding:12px;font-size:15px;font-weight:700}.choice small{display:block;font-weight:400;font-size:11px;color:#7c929a;margin-top:5px}.choice.active{background:#fff6da;border-color:#e5bb5d}.start{background:#34799b;color:white;padding:17px 24px;border-radius:18px;box-shadow:0 5px 0 #245770;font-size:19px;font-weight:700;width:100%;margin-top:18px;display:flex;justify-content:center;gap:25px}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #245770}.helper{font-size:12px;line-height:1.8;color:#7c98a3;margin:20px 0 13px}.other{font-size:12px;color:#507e93;text-underline-offset:5px}footer{text-align:center;font-size:11px;letter-spacing:2px;color:#93a9b2;padding:26px 10px}.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 15px}.hud small{display:block;font-size:11px;color:#7b98a5;margin-bottom:6px}.hud strong{font-size:26px}.hud .time{text-align:center}.hud em{font-style:normal;font-size:12px;margin-left:5px}.timebar{height:7px;background:#dce8ed;border-radius:20px;margin-bottom:12px;overflow:hidden}#timefill{height:100%;background:#e8bb54;width:100%}#field{height:min(56vh,470px);min-height:330px;background:#dceef5;position:relative;border-radius:26px;overflow:hidden;touch-action:none;user-select:none;border:2px solid #c9e0e9}.lane{position:absolute;top:0;bottom:54px;border-left:2px dashed #ffffff70}.l1{left:33.33%}.l2{left:66.66%}.grass{position:absolute;bottom:0;height:52px;width:100%;background:#b6d5ac;border-radius:50% 50% 0 0}.field-flower{position:absolute;bottom:6px;right:10%;font-size:25px;color:#fff9d8}.drop{position:absolute;left:0;top:0;width:96px;height:86px;border:2px solid white;border-radius:18px;background:#fffdf7;box-shadow:0 5px 0 #9dbdca6b;text-align:center;display:flex;align-items:center;flex-direction:column;justify-content:center;font-size:14px;font-weight:700;will-change:transform}.drop .emoji{font-size:34px;line-height:1.2;margin-bottom:6px}.drop .label{white-space:nowrap}#player{position:absolute;width:82px;height:114px;bottom:12px;left:0;will-change:transform;z-index:4;pointer-events:none}.hair{position:absolute;width:50px;height:52px;left:16px;top:0;background:#433b36;border-radius:50% 50% 35% 35%;padding-top:12px}.face{height:40px;background:#f1c5a2;border-radius:40%;position:relative}.face i{position:absolute;top:12px;width:4px;height:5px;background:#433b36;border-radius:50%;left:13px}.face i:nth-child(2){left:34px}.face b{position:absolute;font-size:19px;top:13px;left:18px;font-weight:400}.shirt{position:absolute;top:49px;left:15px;width:53px;height:43px;background:#f8cc52;border-top:8px solid #84bad5;border-radius:10px}.arm{position:absolute;top:54px;width:12px;height:32px;background:#efc5a0;border-top:12px solid #84bad5;border-radius:10px}.arm.left{left:7px;transform:rotate(-18deg)}.arm.right{right:7px;transform:rotate(18deg)}#player .basket{position:absolute;top:64px;width:82px;height:43px;font-size:23px;line-height:30px}.feet{position:absolute;bottom:0;left:17px;width:49px;height:9px;border-left:18px solid #477d9d;border-right:18px solid #477d9d}.controls{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px}.controls button{font-size:26px;background:#fff;border-radius:20px;box-shadow:0 4px 0 #cedfe6;width:100px;height:58px;touch-action:none;user-select:none}.controls span{text-align:center;font-size:14px;font-weight:700}.controls small{font-size:10px;color:#829ca6;font-weight:400}.text-btn{background:transparent;font-size:12px;color:#7795a3;display:block;margin:18px auto 0}#feedback{position:absolute;z-index:6;left:6%;right:6%;top:39%;padding:14px;background:#fffdf5f5;box-shadow:0 5px 0 #b6d3dd;border-radius:18px;text-align:center;font-size:17px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s}#feedback.show{opacity:1}#feedback small{display:block;font-size:13px;font-weight:400;margin-top:7px}#overlay{position:absolute;inset:0;background:#dceef5ed;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:8;text-align:center;padding:25px}#overlay h2{font-size:28px}#overlay p{font-size:14px;line-height:1.8}#overlay .start{max-width:260px}#result{text-align:center;background:#fffdf6;border-radius:28px;padding:30px 20px;border:1px solid #e5e7dc}#result .big{font-size:75px}#result h2{font-size:27px;margin:10px 0}#result .stats{display:flex;gap:10px;margin:25px 0}.stat{flex:1;border-radius:16px;background:#edf4f5;padding:17px 5px;font-size:12px}.stat b{display:block;font-size:28px;margin-bottom:6px}.collected{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.collected span{border-radius:20px;background:#f7eaca;padding:7px 10px;font-size:12px}.review{margin-top:20px;text-align:left;font-size:13px;background:#f0f5f5;padding:15px;border-radius:15px;line-height:1.8}.review strong{display:block}.sub{font-size:13px;color:#79949e;line-height:1.8}@media(max-width:400px){header{padding:15px 18px}.brand span{font-size:12px}main{padding:3px 14px}h1{font-size:34px}.rules{font-size:11px;gap:3px}.poster{height:225px}.sample{width:86px;font-size:12px}.s3{left:37%}.drop{width:86px;font-size:13px}#field{min-height:310px}.controls button{width:83px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style></head><body><header><a href="index.html" class="brand">✳ <span>聖文嘉中英文幼稚園<small>利東校 · 快樂學好習慣</small></span></a><button id="sound" class="round" aria-label="切換語音">🔊</button></header><main><section id="welcome"><div class="eyebrow">LITTLE HABITS · HAPPY HEARTS</div><h1>好習慣<span>接接樂</span><i>✦</i></h1><p class="subtitle">向左、向右，把好習慣帶回家！</p><div class="poster"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="sample s1"><b>🤝</b>輪流玩</div><div class="sample s2"><b>🗑️</b>亂拋垃圾</div><div class="sample s3"><b>🧸</b>收拾玩具</div><div class="poster-kid">🧒🏻<div class="basket">★</div></div><div class="hill"></div><span class="flower f1">✿</span><span class="flower f2">✿</span></div><div class="rules"><span>⭐ 接好行為</span><span>↔ 避開壞行為</span><span>⏱ 每局60秒</span></div><div class="options" role="group" aria-label="選擇難度"><button class="choice active" data-level="easy">🌱 慢慢玩<small>適合初次玩</small></button><button class="choice" data-level="normal">🚀 挑戰版<small>掉落稍快</small></button></div><button class="start" id="start">開始接接樂 <span>→</span></button><p class="helper">手機：拖動小朋友或按左右鍵<br>電腦：滑鼠移動，或鍵盤 ← →</p></section><section id="game" hidden><div class="hud"><div><small>接到好習慣</small><strong>⭐ <span id="score">0</span></strong></div><div class="time"><small>剩餘時間</small><strong><span id="seconds">60</span><em>秒</em></strong></div><button id="pause" class="round" aria-label="暫停遊戲">Ⅱ</button></div><div class="timebar"><div id="timefill"></div></div><div id="field" aria-label="接接樂遊戲區"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="lane l1"></div><div class="lane l2"></div><div class="grass"></div><div class="field-flower">✿</div><div id="drops"></div><div id="player" role="img" aria-label="小朋友接物籃"><div class="hair"><div class="face"><i></i><i></i><b>⌣</b></div></div><div class="shirt"></div><div class="arm left"></div><div class="arm right"></div><div class="basket">★</div><div class="feet"></div></div><div id="feedback" role="status" aria-live="polite"></div><div id="overlay" hidden></div></div><div class="controls"><button id="left" aria-label="向左移動">◀</button><span>接好習慣<br><small>避開不好的行為</small></span><button id="right" aria-label="向右移動">▶</button></div><button id="home" class="text-btn">返回主頁</button></section><section id="result" hidden></section></main><footer>小小好習慣，每天做得到。</footer><script>
(()=>{
const good=[['🌬️','慢慢深呼吸','情緒'],['🙋🏻','主動幫忙','積極'],['💪','勇敢嘗試','勇敢'],['🧩','再試一次','毅力'],['🚶🏻','排隊等候','自律'],['🧸','收拾玩具','負責任'],['🔎','發問求知','求知'],['🤝','輪流玩','謙讓'],['🤙','說到做到','承諾'],['💬','誠實認錯','誠實'],['👂','留心聆聽','聆聽'],['🫶','關心同學','關愛'],['🏗️','合作搭建','團隊合作'],['🙋🏻‍♀️','說出需要','表達'],['🤝','信任同伴','信任'],['🧑🏾‍🤝‍🧑🏻','接納不同','包容'],['🍚','珍惜食物','珍惜'],['🙇🏻','尊重別人','尊重'],['🎁','樂意付出','付出'],['💐','說聲謝謝','感恩']].map(([emoji,label,habit])=>({emoji,label,habit,good:true}));
const bad=[['🗑️','亂拋垃圾','垃圾放入垃圾桶。'],['💥','推撞同學','輕輕行，照顧身邊嘅同學。'],['🚙','搶人玩具','同朋友商量，一齊輪流玩。'],['🗣️','打斷別人','等人講完，再講自己嘅想法。'],['🍚','浪費食物','食幾多，拎幾多。'],['🧸','玩完不收拾','玩完之後，將玩具放返原位。'],['😝','取笑同學','尊重同學，友善相處。'],['🌷','亂摘花朵','愛護花草，用眼睛欣賞。']].map(([emoji,label,tip])=>({emoji,label,tip,good:false}));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function caught(item,px,py,pw){return item.y+item.h>=py&&item.previousY+item.h<py+18&&Math.abs(item.x-px)<(item.w+pw)/2-14;}
function makeDeck(random=Math.random){const shuffled=good.map(x=>({...x})).sort(()=>random()-.5);const result=[];for(let i=0;i<shuffled.length;i++){result.push(shuffled[i]);if(i%2===0)result.push({...bad[Math.floor(random()*bad.length)]})}return result;}

const $=s=>document.querySelector(s);let level='easy',sound=true,mode='home',paused=false,remaining=60,score=0,avoided=0,mistakes=0,items=[],deck=[],deckIndex=0,elapsed=0,nextDrop=0,px=.5,target=.5,held=0,last=0,feedbackTime=0,freeze=0,session=0,found=new Set(),review=new Set();let W=0,H=0;
const field=$('#field'),player=$('#player'),drops=$('#drops');
function say(t){if(!sound||!('speechSynthesis'in window))return;const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.85;const v=s.getVoices().find(v=>/zh[-_]HK|yue/i.test(v.lang));if(v)u.voice=v;s.speak(u)}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function show(id){['welcome','game','result'].forEach(x=>$('#'+x).hidden=x!==id)}
function dimensions(){W=field.clientWidth;H=field.clientHeight;}
function feedback(title,tip='',time=1.8){$('#feedback').replaceChildren();const t=document.createElement('span');t.textContent=title;$('#feedback').append(t);if(tip){const s=document.createElement('small');s.textContent=tip;$('#feedback').append(s)}$('#feedback').classList.add('show');feedbackTime=time}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊':'🔇';$('#sound').setAttribute('aria-label',sound?'關閉語音':'開啟語音');if(!sound)stopVoice()};
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b))});
function start(){session++;mode='ready';paused=false;$('#pause').textContent='Ⅱ';$('#pause').setAttribute('aria-label','暫停遊戲');remaining=60;score=avoided=mistakes=0;items=[];deck=makeDeck();deckIndex=0;elapsed=0;nextDrop=.8;px=target=.5;held=0;feedbackTime=freeze=0;found=new Set();review=new Set();drops.replaceChildren();$('#feedback').classList.remove('show');show('game');dimensions();update();$('#overlay').hidden=false;$('#overlay').innerHTML='<h2>準備好未？</h2><p>接住好行為，避開不好的行為。<br>拖動小朋友，或按左右鍵。</p><button class="start" id="go">我準備好啦 →</button>';$('#go').onclick=()=>{$('#overlay').hidden=true;mode='play';last=performance.now();requestAnimationFrame(t=>frame(t,session));say('好習慣接接樂，開始！')};say('接住好行為，避開不好的行為。');window.scrollTo(0,0)}
$('#start').onclick=start;
function update(){ $('#score').textContent=score;$('#seconds').textContent=Math.ceil(remaining);$('#timefill').style.width=(remaining/60*100)+'%';player.style.transform=`translateX(${px*W-41}px)`; }
function spawn(){if(deckIndex>=deck.length){deck=makeDeck();deckIndex=0}const data=deck[deckIndex++],lane=Math.floor(Math.random()*3);const el=document.createElement('div');el.className='drop';el.setAttribute('aria-label',data.label);const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=data.emoji;const label=document.createElement('span');label.className='label';label.textContent=data.label;el.append(emoji,label);drops.append(el);const w=el.offsetWidth,h=el.offsetHeight;items.push({...data,el,w,h,lane,x:W*(lane+.5)/3,y:-h,previousY:-h});say(data.label)}
function frame(now,key){if(key!==session||mode!=='play')return;const dt=Math.min((now-last)/1000,.05);last=now;if(!paused){if(feedbackTime>0){feedbackTime-=dt;if(feedbackTime<=0)$('#feedback').classList.remove('show')}if(freeze>0)freeze-=dt;else tick(dt)}requestAnimationFrame(t=>frame(t,key))}
function tick(dt){remaining=Math.max(0,remaining-dt);elapsed+=dt;if(held)target=clamp(target+held*dt*.85,41/W,1-41/W);px=clamp(px+(target-px)*Math.min(1,dt*16),41/W,1-41/W);if(elapsed>=nextDrop&&remaining>4){spawn();nextDrop=elapsed+(level==='easy'?3.7:2.5)}const speed=(H-110)/(level==='easy'?5.2:3.8);for(const it of items){it.x=W*(it.lane+.5)/3;it.previousY=it.y;it.y+=speed*dt;const py=H-62;if(caught(it,px*W,py,82)){it.remove=true;if(it.good){score++;found.add(it.habit);feedback('★ '+it.label+'！','你實踐了「'+it.habit+'」。',1.3)}else{mistakes++;review.add(it.tip);freeze=2.3;feedback('再留心一點',it.tip,2.3);say(it.tip)}}else if(it.y>H){it.remove=true;if(!it.good)avoided++}it.el.style.transform=`translate(${it.x-it.w/2}px,${it.y}px)`}items=items.filter(it=>{if(it.remove)it.el.remove();return!it.remove});update();if(remaining<=0)finish()}
function pause(){if(mode!=='play')return;paused=!paused;held=0;$('#pause').textContent=paused?'▶':'Ⅱ';$('#pause').setAttribute('aria-label',paused?'繼續遊戲':'暫停遊戲');$('#overlay').hidden=!paused;if(paused){stopVoice();$('#overlay').innerHTML='<h2>休息一下</h2><p>準備好，就繼續接好習慣啦！</p><button class="start" id="resume">繼續玩 →</button>';$('#resume').onclick=pause}}
$('#pause').onclick=pause;
function home(){session++;mode='home';held=0;stopVoice();show('welcome')}
$('#home').onclick=home;
function finish(){mode='result';session++;held=0;stopVoice();show('result');$('#result').innerHTML=`<div class="eyebrow">每個好習慣，都值得珍惜</div><div class="big">🌟</div><h2>${score?'接到好多好習慣！':'一齊再試一次！'}</h2><p class="sub">${score?'把遊戲裏的好行為，帶到生活中。':'慢慢睇，左右移動，就可以接住。'}</p><div class="stats"><div class="stat"><b>${score}</b>接住好行為</div><div class="stat"><b>${avoided}</b>避開壞行為</div><div class="stat"><b>${mistakes}</b>再練習機會</div></div><div class="collected">${[...found].map(h=>'<span>★ '+h+'</span>').join('')}</div>${review.size?'<div class="review"><strong>下次試吓咁做：</strong>'+[...review].slice(0,3).join('<br>')+'</div>':''}<button class="start" id="again">再玩一次 ↻</button><button class="text-btn" id="backhome">返回主頁</button><p class="sub">今日選一個好習慣，在生活中做出來。</p>`;$('#again').onclick=start;$('#backhome').onclick=home;say(score?'做得好！一齊喺生活中實踐好習慣！':'一齊慢慢嚟，再試一次！')}
function move(e){if(mode!=='play'||paused)return;const rect=field.getBoundingClientRect();target=clamp((e.clientX-rect.left)/rect.width,41/W,1-41/W)}
field.onpointerdown=e=>{if(e.target.closest('#overlay'))return;field.setPointerCapture(e.pointerId);move(e)};field.onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons)move(e)};
function release(){held=0}for(const[id,direction]of[['left',-1],['right',1]]){const b=$('#'+id);b.onpointerdown=e=>{if(mode!=='play'||paused)return;b.setPointerCapture(e.pointerId);held=direction;target=clamp(target+direction*.16,41/W,1-41/W);e.preventDefault()};b.onpointerup=release;b.onpointercancel=release;b.onlostpointercapture=release;b.onclick=e=>{if(e.detail===0&&mode==='play'&&!paused)target=clamp(target+direction/3,41/W,1-41/W)}}
window.addEventListener('keydown',e=>{if(mode!=='play')return;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!e.repeat)pause();if(!paused){if(e.key==='ArrowLeft')held=-1;if(e.key==='ArrowRight')held=1}});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))held=0});window.addEventListener('blur',()=>{held=0;if(mode==='play'&&!paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)pause()});window.addEventListener('resize',()=>{if(mode==='play'||mode==='ready'){dimensions();update()}});

})();
</script></body></html>
